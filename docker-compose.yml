services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: restaurant-dynamodb
    restart: unless-stopped
    # Run as root and persist to a mounted volume so data survives restarts.
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - restaurant_dynamodb_data:/home/dynamodblocal/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-backend
    restart: unless-stopped
    depends_on:
      - dynamodb
    environment:
      # DynamoDB Local connection. In real AWS, drop DYNAMODB_ENDPOINT and the
      # dummy credentials and let the SDK use the instance role / env.
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      PORT: "3000"
      NODE_ENV: development
      # Local-dev convenience: skip Google sign-in and act as a platform admin.
      ADMIN_AUTH_BYPASS: "true"
      JWT_SECRET: development-only-restaurant-admin-secret
      TABLET_AGENT_TOKENS: "1:dev-tablet-token"
      VOICE_RESTAURANT_ID: "1"
      # Optional external integrations — leave blank to run without them:
      # STRIPE_SECRET_KEY:
      # STRIPE_WEBHOOK_SECRET:
      # GOOGLE_CLIENT_ID:
      # ADMIN_EMAILS:
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    # Use nodemon with polling so source edits on the host reload the server.
    command: ["npx", "nodemon", "--legacy-watch", "server/server.js"]

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: restaurant-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: "true"
      VITE_GOOGLE_CLIENT_ID: "141694696905-u6co30j0n74qcb4rf7u1ntatvhspf8l9.apps.googleusercontent.com"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev"]

volumes:
  restaurant_dynamodb_data:
  backend_node_modules:
  frontend_node_modules:
